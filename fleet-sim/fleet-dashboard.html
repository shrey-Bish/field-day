<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">
<style>
  :root { --bg:#0f1419; --panel:#182028; --panel2:#1f2933; --line:#2d3a46; --text:#e6edf3; --muted:#91a0ae;
          --ok:#3fb950; --bad:#f85149; --accent:#4c9aff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
  #app { display: grid; grid-template-columns: 360px 1fr; height: 100%; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 17px; margin: 0; }
  h2 { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 12.5px; margin: 2px 0 0; }
  section { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  button, .filebtn { background: #263340; color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 7px 11px; cursor: pointer; font: inherit; }
  button:hover:not(:disabled), .filebtn:hover { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #06121f; font-weight: 600; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .filebtn input { display: none; }
  label.field { display: grid; grid-template-columns: 1fr 92px; align-items: center; gap: 8px; margin-top: 7px; color: var(--muted); font-size: 13px; }
  input[type=number], select { width: 100%; background: #10171e; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; font: inherit; }
  #fieldInfo { margin-top: 9px; font-size: 13px; color: var(--muted); }
  #fieldInfo b { color: var(--text); }
  .bigbar { height: 10px; background: #10171e; border-radius: 6px; overflow: hidden; margin: 8px 0 6px; }
  .bigbar > div { height: 100%; width: 0; background: var(--ok); transition: width .2s; }
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; text-align: center; }
  .stats div { background: #10171e; border-radius: 7px; padding: 6px 2px; }
  .stats b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
  .stats span { font-size: 11px; color: var(--muted); }
  .tractor { border: 1px solid var(--line); border-left: 5px solid var(--c); border-radius: 8px; padding: 9px 10px; margin-top: 8px; background: #10171e; }
  .tractor .top { display: flex; align-items: center; gap: 8px; }
  .tractor .name { font-weight: 600; margin-right: auto; }
  .badge { font-size: 11px; padding: 2px 7px; border-radius: 99px; background: #263340; color: var(--muted); }
  .badge.working { background: rgba(63,185,80,.18); color: #6fdd7f; }
  .badge.transit { background: rgba(76,154,255,.18); color: #8dbcff; }
  .badge.broken { background: rgba(248,81,73,.2); color: #ff8a84; }
  .tractor .bar { height: 6px; background: #263340; border-radius: 4px; overflow: hidden; margin: 7px 0 5px; }
  .tractor .bar > div { height: 100%; width: 0; background: var(--c); }
  .tractor .nums { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tractor button { padding: 3px 8px; font-size: 12px; }
  #log { max-height: 230px; overflow-y: auto; font-size: 12.5px; display: flex; flex-direction: column; gap: 6px; }
  #log div { padding: 6px 8px; background: #10171e; border-radius: 6px; border-left: 3px solid var(--line); }
  #log div.event { border-left-color: var(--bad); }
  #log div.plan { border-left-color: var(--accent); }
  #log div.good { border-left-color: var(--ok); }
  #log time { color: var(--muted); margin-right: 6px; font-variant-numeric: tabular-nums; }
  #map { height: 100%; width: 100%; background: #0b0f13; }
  .tk { width: 30px; height: 30px; }
  .tk svg { width: 30px; height: 30px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.8)); transform-origin: 50% 50%; }
  .tk.broken svg { opacity: .55; }
  .leaflet-tooltip.tlabel { background: rgba(15,20,25,.85); color: #fff; border: 0; box-shadow: none; font-weight: 600; padding: 1px 6px; }
  .leaflet-tooltip.tlabel::before { display: none; }
  #hint { position: absolute; z-index: 800; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(15,20,25,.9); border: 1px solid var(--line);
          padding: 8px 14px; border-radius: 99px; font-size: 13px; pointer-events: none; }
  main { position: relative; min-width: 0; }
  @media (max-width: 820px) { #app { grid-template-columns: 1fr; grid-template-rows: 55vh auto; } main { order: -1; } aside { border-right: 0; } }
</style>
</head>
<body>
<div id="app">
  <aside>
    <div>
      <h1>Fleet Dashboard</h1>
      <p class="sub">Pick a field on the map, then watch three tractors work it together.</p>
    </div>

    <section>
      <h2>1 · Field</h2>
      <div class="row">
        <button id="btnRect" class="primary">Draw rectangle</button>
        <button id="btnPoly">Draw polygon</button>
        <button id="btnDemo" title="Drop a 400 m square at the centre of the map">Demo square</button>
        <label class="filebtn" title="A polygon saved from Google Earth">Import KML<input id="kml" type="file" accept=".kml,.xml"></label>
      </div>
      <div id="fieldInfo">No field selected yet.</div>
      <div class="row" style="margin-top:9px">
        <button id="btnExport" disabled title="Field file for AgOpenWeb">Export field.geojson</button>
        <button id="btnClear" disabled>Clear field</button>
      </div>
    </section>

    <section>
      <h2>2 · Setup</h2>
      <label class="field">Implement width (m)<input id="inWidth" type="number" min="2" max="60" step="1" value="12"></label>
      <label class="field">Working speed (km/h)<input id="inSpeed" type="number" min="2" max="30" step="1" value="10"></label>
      <label class="field">Simulation speed
        <select id="inRate"><option value="10">10×</option><option value="30" selected>30×</option><option value="60">60×</option><option value="150">150×</option></select>
      </label>
      <div class="row" style="margin-top:11px">
        <button id="btnStart" class="primary" disabled>Start</button>
        <button id="btnPause" disabled>Pause</button>
        <button id="btnReset" disabled>Reset</button>
      </div>
    </section>

    <section>
      <h2>Progress</h2>
      <div class="bigbar"><div id="totalBar"></div></div>
      <div class="stats">
        <div><b id="stPct">0%</b><span>field worked</span></div>
        <div><b id="stHa">0 / 0</b><span>hectares</span></div>
        <div><b id="stClock">00:00</b><span>field time</span></div>
      </div>
      <div id="tractors"></div>
    </section>

    <section>
      <h2>Event log</h2>
      <div id="log"></div>
    </section>
  </aside>

  <main>
    <div id="hint">Click “Draw rectangle”, then drag over a field</div>
    <div id="map"></div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script>
'use strict';
// ---------------------------------------------------------------- setup
const $ = id => document.getElementById(id);
const MAX_PASSES = 600;
const TRACTORS = [
  { id: 1, name: 'Tractor 1', color: '#ffb000' },
  { id: 2, name: 'Tractor 2', color: '#00d0ff' },
  { id: 3, name: 'Tractor 3', color: '#ff5fb0' },
];

const map = L.map('map', { zoomControl: true }).setView([32.6927, -114.6277], 15);   // Yuma, AZ farmland
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 21, maxNativeZoom: 19, attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics' }).addTo(map);
const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  { maxZoom: 21, maxNativeZoom: 19, attribution: '&copy; OpenStreetMap contributors' });
L.control.layers({ 'Satellite': sat, 'Street map': osm }, null, { position: 'topright' }).addTo(map);
L.control.scale({ imperial: false }).addTo(map);

const gField = L.layerGroup().addTo(map);     // boundary
const gPlan = L.layerGroup().addTo(map);      // planned pass lines
const gWork = L.layerGroup().addTo(map);      // worked swaths
const gTractors = L.layerGroup().addTo(map);  // tractor markers

// ---------------------------------------------------------------- state
let field = null;      // { ring:[[lat,lon]...], lat0, lon0, theta, areaM2, layer }
let passes = [];       // { id, v, a, b, a0, b0, owner, busy, done, line }
let running = false, started = false, simTime = 0, lastFrame = 0, finished = false;
let drawer = null;

// ---------------------------------------------------------------- geometry
// Flat local plane in metres around the field centre, rotated so passes run along +u.
const R = 6371008.8, rad = Math.PI / 180;
function toXY(lat, lon) { return [(lon - field.lon0) * rad * R * Math.cos(field.lat0 * rad), (lat - field.lat0) * rad * R]; }
function toUV(lat, lon) {
  const [x, y] = toXY(lat, lon), c = Math.cos(field.theta), s = Math.sin(field.theta);
  return [x * c + y * s, -x * s + y * c];
}
function toLatLng(u, v) {
  const c = Math.cos(field.theta), s = Math.sin(field.theta);
  const x = u * c - v * s, y = u * s + v * c;
  return [field.lat0 + y / (rad * R), field.lon0 + x / (rad * R * Math.cos(field.lat0 * rad))];
}

function setField(ring) {
  clearField();
  if (ring.length > 1 && ring[0][0] === ring[ring.length - 1][0] && ring[0][1] === ring[ring.length - 1][1]) ring = ring.slice(0, -1);
  if (ring.length < 3) { log('That shape has fewer than three corners.', 'event'); return; }
  const lat0 = ring.reduce((s, p) => s + p[0], 0) / ring.length, lon0 = ring.reduce((s, p) => s + p[1], 0) / ring.length;
  field = { ring, lat0, lon0, theta: 0 };
  // Passes run parallel to the longest edge.
  const xy = ring.map(p => toXY(p[0], p[1]));
  let best = 0, area = 0;
  for (let i = 0; i < xy.length; i++) {
    const a = xy[i], b = xy[(i + 1) % xy.length], len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (len > best) { best = len; field.theta = Math.atan2(b[1] - a[1], b[0] - a[0]); }
    area += a[0] * b[1] - b[0] * a[1];
  }
  field.areaM2 = Math.abs(area) / 2;
  field.uv = ring.map(p => toUV(p[0], p[1]));
  field.layer = L.polygon(ring, { color: '#ffffff', weight: 2.5, fill: false, dashArray: '6 5' }).addTo(gField);
  map.fitBounds(field.layer.getBounds(), { padding: [40, 40] });
  $('hint').style.display = 'none';
  $('btnExport').disabled = $('btnClear').disabled = false;
  buildPlan();
}

function clearField() {
  running = false; started = false; finished = false; simTime = 0;
  field = null; passes = [];
  [gField, gPlan, gWork, gTractors].forEach(g => g.clearLayers());
  TRACTORS.forEach(t => { t.marker = null; });
  $('fieldInfo').textContent = 'No field selected yet.';
  $('btnExport').disabled = $('btnClear').disabled = true;
  $('btnStart').disabled = $('btnPause').disabled = $('btnReset').disabled = true;
  $('hint').style.display = '';
  renderPanel();
}

// ---------------------------------------------------------------- planning
function buildPlan() {
  if (!field) return;
  running = false; started = false; finished = false; simTime = 0;
  [gPlan, gWork, gTractors].forEach(g => g.clearLayers());
  $('log').innerHTML = '';
  const w = clamp(+$('inWidth').value || 12, 2, 60);
  const uv = field.uv;
  const vMin = Math.min(...uv.map(p => p[1])), vMax = Math.max(...uv.map(p => p[1]));
  const n = Math.max(1, Math.round((vMax - vMin) / w));
  passes = [];
  if (n > MAX_PASSES) {
    $('fieldInfo').innerHTML = `<b>${(field.areaM2 / 1e4).toFixed(1)} ha</b> — too large for a ${w} m implement (${n} passes). Draw a smaller area or raise the width.`;
    $('btnStart').disabled = true; renderPanel(); return;
  }
  const step = (vMax - vMin) / n;                       // spread the passes evenly edge to edge
  for (let i = 0; i < n; i++) {
    const v = vMin + step * (i + 0.5), xs = [];
    for (let k = 0; k < uv.length; k++) {
      const p = uv[k], q = uv[(k + 1) % uv.length];
      if ((p[1] - v) * (q[1] - v) < 0) xs.push(p[0] + (v - p[1]) / (q[1] - p[1]) * (q[0] - p[0]));
    }
    if (xs.length < 2) continue;
    const a = Math.min(...xs), b = Math.max(...xs);
    if (b - a < 2) continue;
    passes.push({ id: passes.length + 1, v, a, b, a0: a, b0: b, owner: null, busy: false, done: false, line: null });
  }
  field.width = step;
  // Tractors park along the first edge of the field, spread across it.
  const uMin = Math.min(...uv.map(p => p[0]));
  TRACTORS.forEach((t, i) => {
    Object.assign(t, { u: uMin - 15, v: vMin + (vMax - vMin) * (i + 0.5) / TRACTORS.length, heading: 0, state: 'idle',
                       pass: null, dir: 1, seg: null, worked: 0, travel: 0, idle: 0, broken: false });
    t.marker = makeMarker(t);
  });
  passes.forEach(p => {
    p.line = L.polyline([toLatLng(p.a, p.v), toLatLng(p.b, p.v)], { weight: 1.5, opacity: .85, dashArray: '4 6' }).addTo(gPlan);
  });
  const before = snapshot();
  assign();
  $('fieldInfo').innerHTML = `<b>${(field.areaM2 / 1e4).toFixed(2)} ha</b> · ${passes.length} passes of ${step.toFixed(1)} m · heading ${bearing().toFixed(0)}°`;
  log(`Plan ready: ${passes.length} passes split into three side-by-side blocks — ${describe(before)}.`, 'plan');
  $('btnStart').disabled = passes.length === 0; $('btnPause').disabled = true; $('btnReset').disabled = true;
  $('btnStart').textContent = 'Start';
  renderPanel();
}

function bearing() { return ((90 - field.theta / rad) % 180 + 180) % 180; }

// Hand every pass that nobody is working right now to the tractors that can still work:
// neighbouring passes stay together, and each tractor gets about the same length of work.
function assign() {
  const active = TRACTORS.filter(t => !t.broken);
  const open = passes.filter(p => !p.done && !p.busy).sort((p, q) => p.v - q.v);
  open.forEach(p => { p.owner = null; });
  if (!active.length) { recolor(); return; }
  const order = [...active].sort((s, t) => s.v - t.v);            // blocks follow the tractors' positions across the field
  const total = open.reduce((s, p) => s + (p.b - p.a), 0);
  // A tractor in the middle of a pass already has that much work on its plate.
  const have = order.map(t => t.pass && !t.pass.done ? remainingOn(t) : 0);
  const share = (total + have.reduce((s, x) => s + x, 0)) / order.length;
  let k = 0, acc = have[0];
  for (const p of open) {
    const len = p.b - p.a;
    while (k < order.length - 1 && acc + len / 2 > share) { k++; acc = have[k]; }
    p.owner = order[k]; acc += len;
  }
  recolor();
}
function remainingOn(t) {
  if (!t.pass) return 0;
  if (t.state !== 'working') return t.pass.b - t.pass.a;
  return t.dir > 0 ? t.pass.b - t.u : t.u - t.pass.a;
}
function recolor() {
  passes.forEach(p => {
    if (!p.line) return;
    if (p.done) { p.line.setStyle({ opacity: 0 }); return; }
    p.line.setLatLngs([toLatLng(p.a, p.v), toLatLng(p.b, p.v)]);
    p.line.setStyle({ color: p.owner ? p.owner.color : '#9aa7b3', opacity: .85 });
  });
}
function snapshot() { const m = {}; TRACTORS.forEach(t => m[t.id] = passes.filter(p => !p.done && p.owner === t).length); return m; }
function describe(before) {
  return TRACTORS.map(t => {
    const now = passes.filter(p => !p.done && p.owner === t).length, was = before[t.id] || 0;
    if (t.broken) return `${t.name} out of service`;
    const d = now - was;
    return `${t.name} ${now} passes` + (d && started ? ` (${d > 0 ? '+' : ''}${d})` : '');
  }).join(', ');
}

// ---------------------------------------------------------------- simulation
function nextPass(t) {
  let best = null, bestD = Infinity, enterAtA = true;
  for (const p of passes) {
    if (p.done || p.busy || p.owner !== t) continue;
    const dA = Math.hypot(p.a - t.u, p.v - t.v), dB = Math.hypot(p.b - t.u, p.v - t.v);
    if (Math.min(dA, dB) < bestD) { bestD = Math.min(dA, dB); best = p; enterAtA = dA <= dB; }
  }
  if (!best) return false;
  best.busy = true; t.pass = best; t.dir = enterAtA ? 1 : -1; t.state = 'transit';
  t.target = [enterAtA ? best.a : best.b, best.v];
  return true;
}

function stepTractor(t, dt) {
  if (t.broken) return;
  let budget = (clamp(+$('inSpeed').value || 10, 2, 30) / 3.6) * dt;
  let guard = 0;
  while (budget > 1e-6 && guard++ < 50) {
    if (t.state === 'idle' || t.state === 'done') {
      // Out of work while passes are still open elsewhere: re-split so nobody sits idle.
      if (!nextPass(t) && passes.some(p => !p.done && !p.busy)) { assign(); nextPass(t); }
      if (!t.pass) { t.state = passes.every(p => p.done) ? 'done' : 'idle'; t.idle += dt * (budget / ((+$('inSpeed').value || 10) / 3.6 * dt)); return; }
    }
    if (t.state === 'transit') {
      const du = t.target[0] - t.u, dv = t.target[1] - t.v, d = Math.hypot(du, dv);
      if (d > 0.01) t.heading = Math.atan2(dv, du);
      const m = Math.min(d, budget);
      if (d > 0) { t.u += du / d * m; t.v += dv / d * m; }
      t.travel += m; budget -= m;
      if (d - m < 0.01) {
        t.state = 'working'; t.heading = t.dir > 0 ? 0 : Math.PI;
        t.seg = { u0: t.u, layer: L.polygon(swath(t.u, t.u, t.pass.v), { stroke: false, fillColor: t.color, fillOpacity: .55 }).addTo(gWork) };
      }
    } else if (t.state === 'working') {
      const p = t.pass, end = t.dir > 0 ? p.b : p.a, d = Math.abs(end - t.u), m = Math.min(d, budget);
      t.u += t.dir * m; t.worked += m; budget -= m;
      t.seg.layer.setLatLngs(swath(t.seg.u0, t.u, p.v));
      if (d - m < 0.01) { p.done = true; p.busy = false; p.line.setStyle({ opacity: 0 }); t.pass = null; t.seg = null; t.state = 'idle'; }
    }
  }
}
function swath(u0, u1, v) {
  const h = field.width / 2;
  return [toLatLng(u0, v - h), toLatLng(u1, v - h), toLatLng(u1, v + h), toLatLng(u0, v + h)];
}

function frame(ts) {
  if (running && field) {
    const dt = Math.min(0.1, (ts - lastFrame) / 1000) * (+$('inRate').value);
    simTime += dt;
    TRACTORS.forEach(t => stepTractor(t, dt));
    TRACTORS.forEach(placeMarker);
    renderPanel();
    if (!finished && passes.length && passes.every(p => p.done)) {
      finished = true; running = false;
      $('btnPause').disabled = true;
      log(`Field complete in ${clock(simTime)}. ` + TRACTORS.map(t => `${t.name}: ${(t.worked * field.width / 1e4).toFixed(2)} ha`).join(', ') + '.', 'good');
    } else if (!finished && TRACTORS.every(t => t.broken)) {
      running = false; log('All tractors are out of service. Repair one to continue.', 'event');
    }
  }
  lastFrame = ts;
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- events: breakdown / repair
function breakdown(t) {
  if (!field || t.broken) return;
  const before = snapshot();
  let note = '';
  if (t.state === 'working' && t.pass) {             // keep what it finished, release the rest of the pass
    const p = t.pass;
    const donePct = Math.round(100 * Math.abs(t.u - t.seg.u0) / Math.max(1, p.b - p.a));
    if (t.dir > 0) p.a = t.u; else p.b = t.u;
    if (p.b - p.a < 1) p.done = true;
    p.busy = false;
    note = ` partway through pass ${p.id} (${donePct}% of it done and kept)`;
  } else if (t.pass) { t.pass.busy = false; }
  t.pass = null; t.seg = null; t.broken = true; t.state = 'broken';
  const orphans = passes.filter(p => !p.done && p.owner === t).length;
  assign();
  placeMarker(t);
  const left = TRACTORS.filter(x => !x.broken);
  log(`${t.name} broke down${note}.`, 'event');
  log(left.length
    ? `New plan: its ${orphans} unfinished pass${orphans === 1 ? '' : 'es'} were shared among the ${left.length === 1 ? 'one tractor' : left.length + ' tractors'} still running, keeping neighbouring passes together — ${describe(before)}. Finished work is untouched and no pass has two owners.`
    : `No tractor is left to take its ${orphans} unfinished passes; they are waiting for a repair.`, 'plan');
  renderPanel();
}
function repair(t) {
  if (!t.broken) return;
  const before = snapshot();
  t.broken = false; t.state = 'idle';
  assign();
  placeMarker(t);
  log(`${t.name} is repaired and back in service.`, 'good');
  log(`New plan: the remaining passes were re-split across all running tractors — ${describe(before)}.`, 'plan');
  if (started && !finished && !running && $('btnPause').textContent === 'Pause') { running = true; }
  renderPanel();
}

// ---------------------------------------------------------------- rendering
function makeMarker(t) {
  const icon = L.divIcon({ className: 'tk', iconSize: [30, 30], iconAnchor: [15, 15],
    html: `<svg viewBox="0 0 30 30"><path d="M15 2 L26 26 L15 20 L4 26 Z" fill="${t.color}" stroke="#0b0f13" stroke-width="1.6" stroke-linejoin="round"/></svg>` });
  const m = L.marker(toLatLng(t.u, t.v), { icon, interactive: false, zIndexOffset: 1000 }).addTo(gTractors);
  m.bindTooltip(String(t.id), { permanent: true, direction: 'right', offset: [12, 0], className: 'tlabel' });
  t.marker = m; placeMarker(t);
  return m;
}
function placeMarker(t) {
  if (!t.marker || !field) return;
  t.marker.setLatLng(toLatLng(t.u, t.v));
  const el = t.marker.getElement();
  if (!el) return;
  el.classList.toggle('broken', !!t.broken);
  const deg = 90 - (t.heading + field.theta) / rad;       // math angle -> compass rotation
  const svg = el.querySelector('svg'); if (svg) svg.style.transform = `rotate(${deg}deg)`;
}

const LABEL = { idle: 'waiting', transit: 'moving to pass', working: 'working', broken: 'broken down', done: 'finished' };
function renderPanel() {
  const box = $('tractors');
  if (!box.children.length) {
    TRACTORS.forEach(t => {
      const d = document.createElement('div');
      d.className = 'tractor'; d.style.setProperty('--c', t.color);
      d.innerHTML = `<div class="top"><span class="name">${t.name}</span><span class="badge"></span><button></button></div>
                     <div class="bar"><div></div></div><div class="nums"></div>`;
      d.querySelector('button').onclick = () => t.broken ? repair(t) : breakdown(t);
      box.appendChild(d); t.el = d;
    });
  }
  const w = field ? field.width || 0 : 0;
  let workedM = 0;
  TRACTORS.forEach(t => {
    const st = field ? (t.state || 'idle') : 'idle';
    const badge = t.el.querySelector('.badge'), btn = t.el.querySelector('button');
    badge.textContent = LABEL[st]; badge.className = 'badge ' + st;
    btn.textContent = t.broken ? 'Repair' : 'Break down';
    btn.disabled = !field || !passes.length || finished;
    const left = passes.filter(p => !p.done && p.owner === t);
    const leftM = left.reduce((s, p) => s + (p.b - p.a), 0) - (t.state === 'working' ? Math.abs(t.u - t.seg.u0) : 0);
    const done = t.worked || 0; workedM += done;
    t.el.querySelector('.bar > div').style.width = (done + leftM > 0 ? 100 * done / (done + Math.max(0, leftM)) : 0) + '%';
    t.el.querySelector('.nums').textContent = field
      ? `${(done * w / 1e4).toFixed(2)} ha worked · ${left.length} passes left · ${((t.travel || 0) / 1000).toFixed(2)} km travel`
      : '—';
  });
  const totalM = passes.reduce((s, p) => s + (p.b0 - p.a0), 0);
  const pct = totalM ? Math.min(100, 100 * workedM / totalM) : 0;
  $('totalBar').style.width = pct + '%';
  $('stPct').textContent = pct.toFixed(0) + '%';
  $('stHa').textContent = `${(workedM * w / 1e4).toFixed(1)} / ${(totalM * w / 1e4).toFixed(1)}`;
  $('stClock').textContent = clock(simTime);
}
function clock(s) { const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0'); }
function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }
function log(text, kind) {
  const d = document.createElement('div'); if (kind) d.className = kind;
  const tm = document.createElement('time'); tm.textContent = clock(simTime);
  d.appendChild(tm); d.appendChild(document.createTextNode(text));
  $('log').prepend(d);
}

// ---------------------------------------------------------------- controls
function startDraw(kind) {
  if (drawer) drawer.disable();
  const style = { color: '#ffffff', weight: 2 };
  drawer = kind === 'rect' ? new L.Draw.Rectangle(map, { shapeOptions: style, showArea: false })
                           : new L.Draw.Polygon(map, { shapeOptions: style, showArea: false, allowIntersection: false });
  drawer.enable();
  $('hint').style.display = '';
  $('hint').textContent = kind === 'rect' ? 'Drag over the field to select it' : 'Click each corner of the field; click the first corner again to finish';
}
map.on(L.Draw.Event.CREATED, e => { drawer = null; setField(e.layer.getLatLngs()[0].map(p => [p.lat, p.lng])); });
$('btnRect').onclick = () => startDraw('rect');
$('btnPoly').onclick = () => startDraw('poly');
$('btnDemo').onclick = () => {
  const c = map.getCenter(), dLat = 200 / (rad * R), dLon = 200 / (rad * R * Math.cos(c.lat * rad));
  setField([[c.lat - dLat, c.lng - dLon], [c.lat - dLat, c.lng + dLon], [c.lat + dLat, c.lng + dLon], [c.lat + dLat, c.lng - dLon]]);
};
$('btnClear').onclick = () => { clearField(); $('hint').textContent = 'Click “Draw rectangle”, then drag over a field'; $('log').innerHTML = ''; };
$('kml').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const doc = new DOMParser().parseFromString(await f.text(), 'text/xml');
    const poly = doc.getElementsByTagName('Polygon')[0] || doc;
    const node = poly.getElementsByTagName('coordinates')[0];
    const ring = node.textContent.trim().split(/\s+/).map(s => s.split(',').map(Number)).filter(c => c.length >= 2 && isFinite(c[0]) && isFinite(c[1])).map(c => [c[1], c[0]]);
    setField(ring);
    if (field) log(`Imported “${f.name}” (${ring.length} points).`, 'good');
  } catch { clearField(); log(`Could not read a polygon from “${f.name}”.`, 'event'); }
};
$('btnStart').onclick = () => {
  if (!field || !passes.length) return;
  if (finished || started) buildPlan();
  started = true; running = true;
  $('btnStart').textContent = 'Restart'; $('btnPause').disabled = false; $('btnPause').textContent = 'Pause'; $('btnReset').disabled = false;
  log('Work started.', 'good');
};
$('btnPause').onclick = () => { running = !running; $('btnPause').textContent = running ? 'Pause' : 'Resume'; };
$('btnReset').onclick = () => buildPlan();
$('inWidth').onchange = () => { if (field) buildPlan(); };

// field.geojson for AgOpenWeb: origin + outer boundary, points as [lon, lat, heading].
$('btnExport').onclick = () => {
  if (!field) return;
  const pts = [...field.ring, field.ring[0]], xy = pts.map(p => toXY(p[0], p[1]));
  const coords = pts.map((p, i) => {
    const j = Math.min(i, pts.length - 2);
    let h = Math.atan2(xy[j + 1][0] - xy[j][0], xy[j + 1][1] - xy[j][1]); if (h < 0) h += 2 * Math.PI;
    return [+p[1].toFixed(8), +p[0].toFixed(8), +h.toFixed(6)];
  });
  const now = new Date().toISOString(), ha = +(field.areaM2 / 1e4).toFixed(4);
  const gj = { type: 'FeatureCollection', features: [
    { type: 'Feature', geometry: { type: 'Point', coordinates: [+field.lon0.toFixed(8), +field.lat0.toFixed(8)] },
      properties: { role: 'metadata', formatVersion: 1, name: 'FleetField', originLatitude: +field.lat0.toFixed(8), originLongitude: +field.lon0.toFixed(8),
                    convergence: 0, areaHectares: ha, createdDate: now, lastModifiedDate: now } },
    { type: 'Feature', geometry: { type: 'Polygon', coordinates: [coords] },
      properties: { role: 'outer-boundary', isDriveThrough: false, isHard: false, areaHectares: ha } } ] };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(gj, null, 2)], { type: 'application/geo+json' }));
  a.download = 'field.geojson'; a.click(); URL.revokeObjectURL(a.href);
  log('Exported field.geojson.', 'good');
};

renderPanel();
requestAnimationFrame(frame);
</script>
</body>
</html>
